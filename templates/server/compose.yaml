# Generated by `./mcp add __NAME__`. Review and finish the TODOs before `./mcp up`.
# Secrets go in $MCP_SECRETS_DIR/__NAME__.env; non-secret settings and any
# safety policy belong in `environment` below (it overrides env_file).
services:
  gateway:
    networks: [__NAME__-backend]

  __NAME__:
    image: __IMAGE__
    # TODO: command that starts the server's Streamable HTTP transport on
    # 0.0.0.0:__PORT__ with its endpoint at /mcp, e.g.:
    # command: ["--transport", "http", "--host", "0.0.0.0", "--port", "__PORT__"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    env_file:
      - path: ${MCP_SECRETS_DIR:-/etc/mcp-host}/__NAME__.env
        required: true
    environment:
      HOME: /config
    tmpfs:
      - /config:size=64m,uid=10001,gid=10001,mode=0700
      - /tmp:size=64m,mode=1777
    networks: [__NETWORKS__]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    # TODO: replace with a check the image can run (no curl/wget in most images).
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # gateway <-> __NAME__. No egress.
  __NAME__-backend:
    internal: true
__EGRESS_NETWORK__
