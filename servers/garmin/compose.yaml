# Garmin Connect via garmin_mcp (https://github.com/taxuspt/garmin_mcp), built
# from a pinned commit (servers/garmin/Dockerfile). All upstream tools are
# enabled. Auth: OAuth tokens on the garmin-data volume, created once with
#   ./mcp dc run --rm -it --entrypoint garmin-mcp-auth garmin
# The Garmin password is never stored (see servers/garmin/README.md).
services:
  gateway:
    networks: [garmin-backend]

  garmin:
    build: ./servers/garmin
    image: mcp-host/garmin:local
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    env_file:
      - path: ${MCP_SECRETS_DIR:-/etc/mcp-host}/garmin.env
        required: true
    environment:
      GARMIN_MCP_TRANSPORT: streamable-http
      GARMIN_MCP_HOST: 0.0.0.0
      GARMIN_MCP_PORT: "8000"
      GARMINTOKENS: /data/tokens
      GARMINTOKENS_BASE64: /data/tokens_base64
      # Downloads and their config go to tmpfs; nothing else is writable.
      HOME: /tmp
      GARMIN_FIT_DOWNLOAD_DIR: /tmp/downloads
      GARMIN_FIT_CONFIG: /tmp/fit_config.json
    volumes:
      - garmin-data:/data
    tmpfs:
      - /tmp:size=128m,mode=1777
    networks: [garmin-backend, garmin-egress]
    cpus: 1.0
    mem_limit: 384m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # OAuth tokens (about 6 months valid). Back this up or re-run the auth step.
  garmin-data: {}

networks:
  # gateway <-> garmin. No egress.
  garmin-backend:
    internal: true
  # garmin -> Garmin Connect (HTTPS). Only garmin joins it.
  garmin-egress:
    driver_opts:
      com.docker.network.bridge.name: mcp-garmin-egr
